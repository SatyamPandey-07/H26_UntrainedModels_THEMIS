name: Themis runner
run-name: "Themis · ${{ github.event.inputs.mode || github.event.client_payload.mode || 'rescan' }} · ${{ github.event.inputs.repository || github.event.client_payload.repository || 'all installations' }} · ${{ github.event.inputs.package || github.event.client_payload.package || 'recommended' }}"

# Hermes, the orchestrator, is this workflow. Each agent runs as its own job and hands its state to the next one:
#
#   Prepare -> Argus (scout) -> Athena (planner) -> Hephaestus (migrator)
#           -> Minos baseline sandbox  | in parallel
#           -> Minos candidate sandbox |
#           -> Minos verdict -> [Hephaestus retry -> Minos sandboxes -> Minos verdict] -> Clio (capsule) -> Publish
#
# Modes: scan (Argus, then dashboard and proposal issues), plan (Argus, Athena, then a plan comment), run (all).
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Target repository (owner/name) with the Themis App installed
        required: true
      package:
        description: Dependency to migrate (empty = Themis picks the recommended one)
        required: false
        default: ""
      mode:
        description: scan = rank and propose; plan = read-only plan; run = migrate and open a draft PR
        type: choice
        options: [run, plan, scan]
        default: run
      issue_number:
        description: Issue to comment on with the result (optional)
        required: false
        default: ""
  repository_dispatch:
    types: [themis-run]
  schedule:
    # Weekly rescan of every repository that has a Themis Dependency Dashboard.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: themis-${{ github.event.inputs.repository || github.event.client_payload.repository || 'rescan' }}-${{ github.event.inputs.package || github.event.client_payload.package || 'recommended' }}
  cancel-in-progress: false

env:
  THEMIS_WORKTREE_ROOT: ${{ github.workspace }}/worktrees
  THEMIS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  # One retry round is drawn as its own boxes below.
  THEMIS_RETRY_CAP: "1"
  GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
  GROQ_FALLBACK_MODEL: ${{ vars.GROQ_FALLBACK_MODEL || 'qwen/qwen3.8-27b' }}

jobs:
  prepare:
    name: Prepare · target (read-only)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      repository: ${{ steps.inputs.outputs.repository }}
      owner: ${{ steps.inputs.outputs.owner }}
      name: ${{ steps.inputs.outputs.name }}
      package: ${{ steps.inputs.outputs.package }}
      mode: ${{ steps.inputs.outputs.mode }}
      issue_number: ${{ steps.inputs.outputs.issue_number }}
    steps:
      - name: Validate inputs
        id: inputs
        env:
          IN_REPOSITORY: ${{ github.event.inputs.repository || github.event.client_payload.repository }}
          IN_PACKAGE: ${{ github.event.inputs.package || github.event.client_payload.package }}
          IN_MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'run' }}
          IN_ISSUE: ${{ github.event.inputs.issue_number || github.event.client_payload.issue_number }}
        run: |
          set -euo pipefail
          [[ "$IN_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::invalid repository"; exit 1; }
          [[ -z "$IN_PACKAGE" || "$IN_PACKAGE" =~ ^(@[A-Za-z0-9~][A-Za-z0-9._~-]*/)?[A-Za-z0-9~][A-Za-z0-9._~-]*$ ]] || { echo "::error::invalid package name"; exit 1; }
          [[ "$IN_MODE" == "run" || "$IN_MODE" == "scan" || "$IN_MODE" == "plan" ]] || { echo "::error::invalid mode"; exit 1; }
          [[ -z "$IN_ISSUE" || "$IN_ISSUE" =~ ^[0-9]+$ ]] || { echo "::error::invalid issue number"; exit 1; }
          {
            echo "repository=$IN_REPOSITORY"
            echo "owner=${IN_REPOSITORY%%/*}"
            echo "name=${IN_REPOSITORY##*/}"
            echo "package=$IN_PACKAGE"
            echo "mode=$IN_MODE"
            echo "issue_number=$IN_ISSUE"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Hermes · Orchestrator"
            echo "| Repository | Mode | Package | Issue |"
            echo "|---|---|---|---|"
            echo "| \`$IN_REPOSITORY\` | $IN_MODE | ${IN_PACKAGE:-recommended by Themis} | ${IN_ISSUE:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: App token (contents read)
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.THEMIS_APP_CLIENT_ID }}
          private-key: ${{ secrets.THEMIS_APP_PRIVATE_KEY }}
          owner: ${{ steps.inputs.outputs.owner }}
          repositories: ${{ steps.inputs.outputs.name }}
          permission-contents: read

      - name: Refuse private targets on a public runner
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET: ${{ steps.inputs.outputs.repository }}
          RUNNER_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          private=$(gh api "repos/$TARGET" --jq .private)
          if [[ "$private" == "true" && "$RUNNER_PRIVATE" != "true" ]]; then
            echo "::error::$TARGET is private; private repositories need a private runner repository."
            exit 1
          fi

      - name: Clone default branch
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          TARGET: ${{ steps.inputs.outputs.repository }}
        run: |
          set -euo pipefail
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$header" clone --depth 1 "https://github.com/$TARGET.git" target
          git -C target remote set-url origin "https://github.com/$TARGET.git"
          git -C target config user.name "themis[bot]"
          git -C target config user.email "themis-bot@users.noreply.github.com"
          mkdir -p worktrees
          tar -czf state.tgz target worktrees

      - uses: actions/upload-artifact@v7
        with:
          name: state-prepare
          path: state.tgz
          retention-days: 1

  argus:
    name: Argus · Scout
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      run_dir: ${{ steps.scout.outputs.run_dir }}
      recommended: ${{ steps.scout.outputs.recommended }}
      state: ${{ steps.handover.outputs.state }}
    env:
      # Up to five Groq keys, tried in order; each key tries GROQ_MODEL, then GROQ_FALLBACK_MODEL.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/themis-setup
        with: { state: state-prepare }
      - name: Rank dependencies
        id: scout
        env:
          PACKAGE: ${{ needs.prepare.outputs.package }}
        run: node packages/core/dist/cli.js -C target stage scout ${PACKAGE:+"$PACKAGE"}
      - name: Hand over
        run: tar -czf state.tgz target worktrees
      - uses: actions/upload-artifact@v7
        with: { name: state-argus, path: state.tgz, retention-days: 1 }
      - id: handover
        run: echo "state=state-argus" >> "$GITHUB_OUTPUT"

  athena:
    name: Athena · Planner
    needs: [prepare, argus]
    if: ${{ needs.prepare.outputs.mode != 'scan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      feasible: ${{ steps.plan.outputs.feasible }}
      dependency: ${{ steps.plan.outputs.dependency }}
      state: ${{ steps.handover.outputs.state }}
    env:
      # Up to five Groq keys, tried in order; each key tries GROQ_MODEL, then GROQ_FALLBACK_MODEL.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/themis-setup
        with: { state: state-argus }
      - name: Map usage and plan
        id: plan
        run: node packages/core/dist/cli.js stage plan "${{ needs.argus.outputs.run_dir }}"
      - name: Hand over
        run: tar -czf state.tgz target worktrees
      - uses: actions/upload-artifact@v7
        with: { name: state-athena, path: state.tgz, retention-days: 1 }
      - id: handover
        run: echo "state=state-athena" >> "$GITHUB_OUTPUT"

  hephaestus:
    name: Hephaestus · Migrator
    needs: [prepare, argus, athena]
    if: ${{ needs.prepare.outputs.mode == 'run' && needs.athena.outputs.feasible == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      state: ${{ steps.handover.outputs.state }}
    env:
      # Up to five Groq keys, tried in order; each key tries GROQ_MODEL, then GROQ_FALLBACK_MODEL.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/themis-setup
        with: { state: state-athena }
      - name: Branch, edit and pin behaviour
        run: node packages/core/dist/cli.js stage migrate "${{ needs.argus.outputs.run_dir }}"
      - name: Hand over
        run: tar -czf state.tgz target worktrees
      - uses: actions/upload-artifact@v7
        with: { name: state-hephaestus, path: state.tgz, retention-days: 1 }
      - id: handover
        run: echo "state=state-hephaestus" >> "$GITHUB_OUTPUT"

  minos-sandbox:
    name: Minos · ${{ matrix.side }} sandbox
    needs: [argus, hephaestus]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        side: [baseline, candidate]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/themis-setup
        with: { state: state-hephaestus }
      - name: Build and check in Docker
        run: node packages/core/dist/cli.js stage verify "${{ needs.argus.outputs.run_dir }}" --side "${{ matrix.side }}"
      - name: Hand over this side
        if: always()
        run: tar -czf side.tgz -C target .themis
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "side-${{ matrix.side }}", path: side.tgz, retention-days: 1 }

  minos-verdict:
    name: Minos · Verdict
    needs: [argus, hephaestus, minos-sandbox]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      retry: ${{ steps.judge.outputs.retry }}
      passed: ${{ steps.judge.outputs.passed }}
      state: ${{ steps.handover.outputs.state }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/themis-setup
        with: { state: state-hephaestus }
      - uses: actions/download-artifact@v8
        with: { pattern: "side-*", path: sides }
      - name: Merge both sandboxes
        env:
          RUN: ${{ needs.argus.outputs.run_dir }}
        run: node scripts/merge-sides.mjs "$RUN" sides/side-baseline/side.tgz sides/side-candidate/side.tgz
      - name: Judge the delta
        id: judge
        run: node packages/core/dist/cli.js stage judge "${{ needs.argus.outputs.run_dir }}"
      - name: Hand over
        run: tar -czf state.tgz target worktrees
      - uses: actions/upload-artifact@v7
        with: { name: state-verdict, path: state.tgz, retention-days: 1 }
      - id: handover
        run: echo "state=state-verdict" >> "$GITHUB_OUTPUT"

  hephaestus-retry:
    name: Hephaestus · Migrator (retry)
    needs: [argus, minos-verdict]
    if: ${{ needs.minos-verdict.outputs.retry == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Up to five Groq keys, tried in order; each key tries GROQ_MODEL, then GROQ_FALLBACK_MODEL.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/themis-setup
        with: { state: state-verdict }
      - name: Fix what Minos vetoed
        run: node packages/core/dist/cli.js stage migrate "${{ needs.argus.outputs.run_dir }}"
      - name: Hand over
        run: tar -czf state.tgz target worktrees
      - uses: actions/upload-artifact@v7
        with: { name: state-hephaestus-retry, path: state.tgz, retention-days: 1 }

  minos-sandbox-retry:
    name: Minos · ${{ matrix.side }} sandbox (retry)
    needs: [argus, hephaestus-retry]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        side: [baseline, candidate]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/themis-setup
        with: { state: state-hephaestus-retry }
      - name: Build and check in Docker
        run: node packages/core/dist/cli.js stage verify "${{ needs.argus.outputs.run_dir }}" --side "${{ matrix.side }}"
      - name: Hand over this side
        if: always()
        run: tar -czf side.tgz -C target .themis
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "retry-side-${{ matrix.side }}", path: side.tgz, retention-days: 1 }

  minos-verdict-retry:
    name: Minos · Verdict (retry)
    needs: [argus, hephaestus-retry, minos-sandbox-retry]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      state: ${{ steps.handover.outputs.state }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/themis-setup
        with: { state: state-hephaestus-retry }
      - uses: actions/download-artifact@v8
        with: { pattern: "retry-side-*", path: sides }
      - name: Merge both sandboxes
        env:
          RUN: ${{ needs.argus.outputs.run_dir }}
        run: node scripts/merge-sides.mjs "$RUN" sides/retry-side-baseline/side.tgz sides/retry-side-candidate/side.tgz
      - name: Judge the delta
        run: node packages/core/dist/cli.js stage judge "${{ needs.argus.outputs.run_dir }}"
      - name: Hand over
        run: tar -czf state.tgz target worktrees
      - uses: actions/upload-artifact@v7
        with: { name: state-verdict-retry, path: state.tgz, retention-days: 1 }
      - id: handover
        run: echo "state=state-verdict-retry" >> "$GITHUB_OUTPUT"

  clio:
    name: Clio · Capsule writer
    needs:
      [prepare, argus, athena, hephaestus, minos-sandbox, minos-verdict, hephaestus-retry, minos-sandbox-retry, minos-verdict-retry]
    if: ${{ always() && needs.prepare.outputs.mode == 'run' && needs.argus.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      state: ${{ steps.handover.outputs.state }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/themis-setup
        with:
          tools: "false"
          # The latest state any agent handed over.
          state: ${{ needs.minos-verdict-retry.outputs.state || needs.minos-verdict.outputs.state || (needs.hephaestus.result == 'success' && needs.hephaestus.outputs.state) || needs.athena.outputs.state || needs.argus.outputs.state }}
      - name: Write the capsule
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') && 'an earlier agent job failed; see the run log' || '' }}
        run: node packages/core/dist/cli.js stage capsule "${{ needs.argus.outputs.run_dir }}" ${FAILED:+--error "$FAILED"}
      - name: Upload run record
        uses: actions/upload-artifact@v7
        with:
          name: themis-run
          path: target/.themis/runs
          retention-days: 14
          include-hidden-files: true
      - name: Hand over
        run: tar -czf state.tgz target worktrees
      - uses: actions/upload-artifact@v7
        with: { name: state-clio, path: state.tgz, retention-days: 1 }
      - id: handover
        run: echo "state=state-clio" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish · ${{ needs.prepare.outputs.mode == 'scan' && 'dashboard and proposals' || needs.prepare.outputs.mode == 'plan' && 'plan comment' || 'draft PR and check run' }}
    needs: [prepare, argus, athena, clio]
    if: ${{ always() && needs.prepare.result == 'success' && needs.argus.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      auto_package: ${{ steps.publish.outputs.auto_package }}
      dashboard_issue: ${{ steps.publish.outputs.dashboard_issue }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/themis-setup
        with:
          tools: "false"
          github-app: "true"
          state: ${{ needs.clio.outputs.state || needs.athena.outputs.state || needs.argus.outputs.state }}

      - name: App token (write)
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.THEMIS_APP_CLIENT_ID }}
          private-key: ${{ secrets.THEMIS_APP_PRIVATE_KEY }}
          owner: ${{ needs.prepare.outputs.owner }}
          repositories: ${{ needs.prepare.outputs.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: write
          permission-issues: write

      - name: Bundle the Themis branch
        env:
          RUN: ${{ needs.argus.outputs.run_dir }}
          RECOMMENDED: ${{ needs.argus.outputs.recommended }}
        run: |
          set -uo pipefail
          branch=$(node -e 'try{process.stdout.write(require(process.argv[1]).branch||"")}catch{}' "$RUN/capsule.json")
          if [[ -n "$branch" ]] && git -C target rev-parse --verify --quiet "refs/heads/$branch" >/dev/null; then
            git -C target bundle create ../themis.bundle "$(git -C target rev-parse HEAD)..refs/heads/$branch"
          fi
          node -e 'require("fs").writeFileSync("result.json", JSON.stringify({ runDir: process.argv[1], recommended: process.argv[2] }))' "$RUN" "$RECOMMENDED"

      - name: Publish results
        id: publish
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          TARGET_REPO: ${{ needs.prepare.outputs.repository }}
          MODE: ${{ needs.prepare.outputs.mode }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          RESULT_JSON: result.json
          RUN_DIR: ${{ needs.argus.outputs.run_dir }}
          BUNDLE: themis.bundle
          RUN_URL: ${{ env.THEMIS_RUN_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_SECRET: ${{ secrets.ALERT_WEBHOOK_SECRET }}
        run: node apps/github-app/dist/publish.js

  auto-migrate:
    name: Hermes · queue automatic migration
    needs: [prepare, publish]
    if: ${{ needs.publish.outputs.auto_package != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Dispatch migration run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.prepare.outputs.repository }}
          PACKAGE: ${{ needs.publish.outputs.auto_package }}
          ISSUE: ${{ needs.publish.outputs.dashboard_issue }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=themis-run \
            -f "client_payload[repository]=$TARGET" \
            -f "client_payload[mode]=run" \
            -f "client_payload[package]=$PACKAGE" \
            -f "client_payload[issue_number]=$ISSUE" \
            -f "client_payload[trigger]=auto"

  rescan:
    name: Hermes · weekly rescan
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/themis-setup
        with: { tools: "false", github-app: "true" }
      - name: Queue scans
        env:
          THEMIS_APP_CLIENT_ID: ${{ vars.THEMIS_APP_CLIENT_ID }}
          THEMIS_APP_PRIVATE_KEY: ${{ secrets.THEMIS_APP_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          RUNNER_REPO: ${{ github.repository }}
        run: node apps/github-app/dist/rescan.js
